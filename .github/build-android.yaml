name: Build OrdnanceMesh Android APK

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - "android/**"
      - ".github/workflows/build-android.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout OrdnanceMesh
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Bootstrap Android project & inject OrdnanceMesh permissions
        working-directory: mobile
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --org com.ordnancemesh --project-name ordnance_mesh .
          fi

          python3 - <<'PY'
          import pathlib

          manifest = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text(encoding="utf-8")

          perms = [
              '<uses-permission android:name="android.permission.INTERNET" />',
              '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />',
              '<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />',
              '<uses-permission android:name="android.permission.BLUETOOTH_SCAN" />',
              '<uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />',
          ]
          missing = [p for p in perms if p not in text]
          if missing:
              text = text.replace("<application", "\n    ".join(missing) + "\n    <application", 1)

          if 'usesCleartextTraffic' not in text:
              text = text.replace("<application", '<application android:usesCleartextTraffic="true"', 1)

          manifest.write_text(text, encoding="utf-8")
          print("Updated AndroidManifest.xml cleanly.")
          PY

      - name: Install dependencies & build release APK
        working-directory: mobile
        run: |
          flutter pub get
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk ../OrdnanceMesh-android.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OrdnanceMesh-android-apk
          path: OrdnanceMesh-android.apk

      - name: Attach APK to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" OrdnanceMesh-android.apk --clobber